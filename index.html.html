<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>제일 과학학원 실장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .header { text-align: center; margin-bottom: 36px; }
    .logo { font-size: 52px; margin-bottom: 12px; }
    .title { color: #fff; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
    .subtitle { color: rgba(255,255,255,0.35); font-size: 12px; font-weight: 600; margin-top: 6px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 480px;
    }

    .card {
      display: block;
      text-decoration: none;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { transform: scale(0.96); }

    .card-inner {
      padding: 22px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 130px;
      text-align: center;
      gap: 8px;
    }

    .card-emoji { font-size: 34px; }
    .card-name { color: #fff; font-size: 15px; font-weight: 900; line-height: 1.2; }
    .card-badge {
      color: rgba(255,255,255,0.65);
      font-size: 10px;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .c1 { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .c2 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .c3 { background: linear-gradient(135deg, #6366f1, #4338ca); }
    .c4 { background: linear-gradient(135deg, #14b8a6, #0f766e); }
    .c5 { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .c6 { background: linear-gradient(135deg, #10b981, #059669); }
    .c7 { background: linear-gradient(135deg, #ec4899, #db2777); }

    .footer { margin-top: 28px; color: rgba(255,255,255,0.18); font-size: 11px; font-weight: 600; }

    @media (max-width: 380px) {
      .card-inner { min-height: 110px; padding: 18px 14px; }
      .card-emoji { font-size: 28px; }
      .card-name { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🏫</div>
    <div class="title">제일 과학학원</div>
    <div class="subtitle">반을 선택하세요</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">실장용 · Jeil Science Academy</div>

  <script>
    const CLASSES = [
      { name: '물리학반',   emoji: '⚛️', color: 'c1', base: 'https://llllddd5162.github.io/Jeil-science-Physics/',        code: '71207179' },
      { name: '무학해성반', emoji: '🔬', color: 'c2', base: 'https://llllddd5162.github.io/Jeil-science-MuhakHaeseong1/', code: '71207179' },
      { name: '도선경일반', emoji: '📐', color: 'c3', base: 'https://llllddd5162.github.io/Jeil-science-DosunKyungil1/',  code: '71207179' },
      { name: '성동1S반',   emoji: '🌟', color: 'c4', base: 'https://llllddd5162.github.io/Jeil-science-Seongdong1S/',    code: '71207179' },
      { name: '화학반',     emoji: '🧪', color: 'c5', base: 'https://llllddd5162.github.io/Jeil-science-Chem/',           code: 'arthun0709' },
      { name: '성동1H반',   emoji: '📚', color: 'c6', base: 'https://llllddd5162.github.io/Jeil-science-Seongdong1H/',    code: '01031107' },
      { name: '생명과학반', emoji: '🧬', color: 'c7', base: 'https://llllddd5162.github.io/Jeil-science-Biology/',        code: 'shapekim02' },
    ];

    const grid = document.getElementById('grid');
    CLASSES.forEach(cls => {
      const a = document.createElement('a');
      // URL에 마스터 코드 포함 → 클릭만 하면 자동 로그인
      a.href = `${cls.base}?code=${cls.code}`;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'card';
      a.innerHTML = `
        <div class="card-inner ${cls.color}">
          <div class="card-emoji">${cls.emoji}</div>
          <div class="card-name">${cls.name}</div>
          <div class="card-badge">바로 접속 →</div>
        </div>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
